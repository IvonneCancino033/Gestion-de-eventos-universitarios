<!-- lista de usuarios, solo la ve el administrador -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
</head>
<body>
    <h2>Usuarios</h2>
    <p><a href="{% url 'inicio' %}">Volver al inicio</a></p>

    {% endfor %}
</body>
</html>
