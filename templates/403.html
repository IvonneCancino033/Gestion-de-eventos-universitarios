<!-- pagina que sale cuando el usuario no tiene permiso (error 403) -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 403: Acceso denegado</title>
</head>
<body>
    <h2>Acceso denegado</h2>
    <p>No tiene permisos para ver esta página.</p>
    <p><a href="{% url 'inicio' %}">Volver al inicio</a></p>
</body>
</html>
