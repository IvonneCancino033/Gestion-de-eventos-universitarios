{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Eventos Universitarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="container" style="max-width: 380px;">
    <div class="card card-custom p-4 shadow-sm">
      <div class="card-body">
        <h4 class="card-title text-center fw-bold mb-1">Gestión de Eventos Universitarios</h4>
        <p class="text-center text-muted small mb-4">Ingrese sus credenciales de acceso</p>

        <!-- Bloque de errores de autenticacion-->
        {% if form.errors %}
        <div class="alert alert-danger p-2 small text-center mb-3" role="alert">
          Usuario o contraseña incorrectos. Intente nuevamente.
        </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label small fw-semibold">Usuario</label>
            <input type="text" name="username" id="id_username" class="form-control" placeholder="Ej: kata" value="{{ form.username.value|default:'' }}" required>
          </div>

          <div class="mb-3">
            <label for="id_password" class="form-label small fw-semibold">Contraseña</label>
            <input type="password" name="password" id="id_password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">Iniciar sesión</button>
        </form>

        <div class="text-center">
          <a href="{% url 'password_reset' %}" class="text-decoration-none small text-muted">¿Olvidaste tu contraseña?</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
