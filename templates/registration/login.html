<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
</head>
<body>
    <h2>Gestión de Eventos Universitarios</h2>
    <p>Ingrese sus credenciales de acceso</p>

    {% if form.errors %}
        <h2>Nombre de usuario o contraseña incorrectos.</h2>
        <p>Por favor intente nuevamente.</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div>
            <label for="usuario">Usuario</label>
            <input type="text" name="username" id="usuario" required>
        </div>
        <div>
            <label for="contrasena">Contraseña</label>
            <input type="password" name="password" id="contrasena" required>
        </div>
        <button type="submit">Iniciar sesión</button>
    </form>
</body>
</html>
