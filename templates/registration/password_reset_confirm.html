{% extends "base.html" %}

{% block title %}Nueva contraseña{% endblock %}

{% block content %}
<div class="mx-auto py-4" style="max-width: 500px;">
  <div class="card card-custom shadow-sm">
    <div class="card-body p-4">
      <h2 class="fw-bold text-dark h4">Nueva contraseña</h2>

      <!-- si el enlace sirve, muestra el formulario -->
      {% if validlink %}
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary-custom w-100">Cambiar contraseña</button>
        </form>
      {% else %}
        <div class="alert alert-danger mb-3">
          El enlace no es válido o ha expirado.
        </div>
        <a href="{% url 'password_reset' %}" class="btn btn-outline-secondary">Solicitar uno nuevo</a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
