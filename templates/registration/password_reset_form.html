{% extends "base.html" %}

{% block title %}Recupera tu cuenta{% endblock %}

{% block content %}
<div class="mx-auto py-4" style="max-width: 500px;">
  <div class="card card-custom shadow-sm">
    <div class="card-body p-4">
      <h2 class="fw-bold text-dark h4">Recupera tu cuenta</h2>
      <p class="text-muted small mb-3">Introduce tu dirección de correo electrónico.</p>

      <!-- formulario con el correo -->
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <input type="email" name="email" id="id_email" class="form-control"
                 placeholder="correo@ejemplo.cl" autocomplete="email" required>
          {% for error in form.email.errors %}
            <div class="text-danger small mt-1">{{ error }}</div>
          {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary-custom w-100">Enviar instrucciones</button>
      </form>

      <div class="text-center mt-3">
        <a href="{% url 'login' %}" class="small text-decoration-none">Volver a iniciar sesión</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
