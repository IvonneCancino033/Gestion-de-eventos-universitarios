<!doctype html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        
        <title>Mostrar asistencia</title>
    </head>
    <body>
        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">
                Cerrar sesión
            </button>
        </form>
        <div class="container">
            <h1>Asistencia</h1>
            <h3>Eventos:</h3>
            <a href="{% url 'buscar_participante' %}" class="btn btn-outline-success">Registrar asistencia</a>
            <table class="table table-striped table-hover" >
                <thead>
                    <tr>
                        <th scope="col" class="col-3 " >id evento</th>
                        <th scope="col " class="col-5">Nombre de evento</th>
                        <th scope="col" class="col-4"></th>
                    </tr>
                </thead>
                <tbody>
                    {% for evento in eventos %}
                    <tr>
                        <th scope="row">{{ evento.id}}</th>
                        <td>{{ evento.nombre }}</td>    
                        <td> 
                            <a href="{% url 'mostrar_asistencia' evento.id %}" class="btn btn-outline-success" >ver asistencia</a>                   
                        </td>
                        {% empty %}

                        <p>No se encontraron eventos.</p>

                    {% endfor %}    
                    </tr>
                </tbody>
            </table>
        </div>            
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    </body>
</html>
