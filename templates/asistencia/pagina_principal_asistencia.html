<!doctype html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        
        <title>Mostrar asistencia</title>
    </head>
    <body>
        <header>
            <nav class="navbar navbar-dark" style="background-color: #B02A37;">
                <div class="container-fluid">

                    <span class="navbar-brand mb-0 h1">
                        Eventos Universitarios
                    </span>

                    <form class="d-flex" method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-light" type="submit">
                            Cerrar sesión
                        </button>
                    </form>
                    
                </div>
            </nav>
        </header>
        
        <div class="container">
            <a href="{% url 'principal_usuario' %}">
                Mostrar mis asistencias
            </a>
            <h1>Gestión de asistencia</h1>
            <div class="mb-4 mt-4">
                <div class="card bg-light">
                    <div class="card-body">
                        <div class="row gx-1">
    
                            <h2 class="text-center">Registrar asistencia</h2>
                        </div>
                        
                        <div class="card-title">
                            <div class="d-grid gap-2 col-6 mx-auto">
                                <a href="{% url 'buscar_participante' %}" class="btn text-light" style="background-color: #B02A37; height: 50px;">Registrar asistencia</a>
                            </div>
                        </div>
                    </div>                    
                </div>
            </div>
            <div class="mb-4 mt-4">
                
                <div class="card bg-light">
                    <div class="card-body">
                        <h5 class="card-title">
                            Eventos:
                        </h5>
                        <h6 class="card-subtitle mb-2 text-muted">
                            Selecciona un evento
                        </h6>
                    </div>
                </div>
            </div>    
            {% for evento in eventos %}
            <div class="mt-4 mb-4">
                <div class="card bg-light">
                    <div class="card-body">
                        <h5 class="card-title">
                            {{ evento.nombre }}
                        </h5>
                        <h6 class="card-subtitle mb-2 text-muted">
                            Fecha: {{ evento.fecha_inicio }}
                        </h6>
                        <a href="{% url 'mostrar_asistencia' evento.id %}" class="btn text-light" style="background-color: #B02A37;" >ver asistencia</a>                   
                        <a href="{% url 'estadisticas' evento.id %}" class="btn text-light" style="background-color: #B02A37;"  >ver estadísticas</a>  

                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </body>
</html>
