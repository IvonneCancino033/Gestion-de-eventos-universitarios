<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
</head>
<body>
     <h1>Buscar participante</h1>

    <form method="GET">

        <input
            type="text"
            name="q"
            placeholder="Ingrese nombre de usuario"
            value="{{ busqueda }}"
        >

        <button type="submit">
            Buscar
        </button>

    </form>

    <hr>

    {% for inscripcion in inscripciones %}

        <h3>
            {{ inscripcion.usuario.username }}
            {{ inscripcion.evento.nombre }}
        </h3>

        <a href="{% url 'registrar_asistencia' inscripcion.id %}">
            Registrar asistencia
        </a>

    {% empty %}

        <p>No se encontraron participantes.</p>

    {% endfor %}

</body>
