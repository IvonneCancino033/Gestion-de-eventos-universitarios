<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if categoria %}Editar categoría{% else %}Nueva categoría{% endif %}</title>
</head>
<body>
    <h2>{% if categoria %}Editar categoría{% else %}Nueva categoría{% endif %}</h2>

    <form method="POST">
        {% csrf_token %}
        <div>
            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" id="nombre"
                   value="{{ categoria.nombre|default:'' }}" required>
        </div>
        <div>
            <label for="descripcion">Descripción</label>
            <textarea name="descripcion" id="descripcion" rows="3">{{ categoria.descripcion|default:'' }}</textarea>
        </div>
        <button type="submit">Guardar</button>
    </form>

    <p><a href="{% url 'lista_categorias' %}">Volver a la lista</a></p>
</body>
</html>
