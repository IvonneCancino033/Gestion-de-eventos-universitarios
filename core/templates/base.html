{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- bloque del el titulo de la pestaña-->
  <title>{% block title %}Gestión de Eventos Universitarios{% endblock %}</title>

  <!-- Bootstrap e iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- paleta de colores -->
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>

  <!-- barra de navegacion superior -->
  <nav class="navbar navbar-expand-lg navbar-custom shadow-sm py-2">
    <div class="container">
      <!-- logo que redirige a la pagina principal -->
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="{% url 'inicio' %}">
        <i class="bi bi-calendar-event-fill"></i> Eventos Universitarios
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        {% if user.is_authenticated %}
        <ul class="navbar-nav me-auto ms-3">
          <li class="nav-item"><a class="nav-link" href="{% url 'inicio' %}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'lista_eventos' %}">Eventos</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'lista_categorias' %}">Categorías</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3 ms-auto">
          <span class="text-white small">
            <i class="bi bi-person-circle"></i> {{ user.username }}
          </span>
          <form method="post" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-custom btn-sm rounded-2">Cerrar sesión</button>
          </form>
        </div>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- contenedor principal -->
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center py-3 text-muted small border-top bg-white">
    Gestión de Eventos Universitarios
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
